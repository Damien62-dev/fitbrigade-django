{% extends 'base.html' %}
{% load static %}

{% block title %}Send Message - FitBrigade{% endblock %}

{% block content %}
<a href="{% url 'messaging:inbox' %}" class="back-link">← Back to Inbox</a>
<br><br>

<h2>Send a Message</h2>
<br>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label for="recipient" class="form-label fw-bold">To</label>
        <select id="recipient" name="recipient" class="form-select" required>
            <option value="">-- Select a user --</option>
            {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="subject" class="form-label fw-bold">Subject</label>
        <input type="text" id="subject" name="subject" class="form-control"
            required placeholder="e.g., Training advice">
    </div>

    <div class="mb-3">
        <label for="body" class="form-label fw-bold">Message</label>
        <textarea id="body" name="body" class="form-control" rows="6"
            required placeholder="Write your message here..."></textarea>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a href="{% url 'messaging:inbox' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-send"></i> Send
        </button>
    </div>
</form>
{% endblock %}
