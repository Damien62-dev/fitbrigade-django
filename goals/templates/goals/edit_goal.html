{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Goal - FitBrigade{% endblock %}

{% block content %}
<a href="{% url 'goals:goal_detail' goal.id %}" class="back-link">← Back to Goal</a>
<br><br>

<h2>Edit Goal</h2>
<br>

<form method="POST" id="goalForm">
  {% csrf_token %}

  <div class="mb-3">
    <label for="name" class="form-label fw-bold">Name *</label>
    <input type="text" id="name" name="name" class="form-control" required
      placeholder="e.g., Do my first pull-up" value="{{ goal.name }}">
  </div>

  <div class="mb-3">
    <label for="deadline" class="form-label fw-bold">Deadline (optional)</label>
    <input type="date" id="deadline" name="deadline" class="form-control"
      value="{{ goal.deadline|date:'Y-m-d'|default:'' }}">
  </div>

  <div class="mb-3">
    <label for="exercise" class="form-label fw-bold">Related Exercise (optional)</label>
    <select id="exercise" name="exercise" class="form-select">
      <option value="">-- Not exercise-specific --</option>
      {% for muscle_name, exercises in all_exercises.items %}
      <optgroup label="{{ muscle_name }}">
        {% for exercise in exercises %}
        {% if goal.exercise and goal.exercise.id == exercise.id %}
        <option value="{{ exercise.id }}" selected>{{ exercise.name }}</option>
        {% else %}
        <option value="{{ exercise.id }}">{{ exercise.name }}</option>
        {% endif %}
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="target_weight" class="form-label fw-bold">Target Weight (kg) (optional)</label>
    <input type="number" id="target_weight" name="target_weight" class="form-control"
      step="0.5" placeholder="e.g., 100"
      value="{{ goal.target_weight|default:'' }}">
  </div>

  <div class="mb-3">
    <label for="target_reps" class="form-label fw-bold">Target Reps (optional)</label>
    <input type="number" id="target_reps" name="target_reps" class="form-control"
      min="1" placeholder="e.g., 5"
      value="{{ goal.target_reps|default:'' }}">
  </div>

  <div class="mb-3">
    <label for="notes" class="form-label fw-bold">Description / Notes *</label>
    <textarea id="notes" name="notes" class="form-control" rows="4" required
      placeholder="Describe your goal and what success looks like...">{{ goal.notes|default:'' }}</textarea>
  </div>

  <div class="d-flex gap-2 mt-3">
    <a href="{% url 'goals:goal_detail' goal.id %}" class="btn-secondary">Cancel</a>
    <button type="submit" class="btn-primary">Save Changes</button>
  </div>
</form>
{% endblock %}
