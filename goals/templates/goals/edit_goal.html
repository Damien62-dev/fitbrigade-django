{% extends "base.html" %}
{% block content %}
<h2>Edit Goal</h2>
<br>
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" required value="{{ goal.name }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Deadline (optional)</label>
        <input type="date" name="deadline" class="form-control" value="{{ goal.deadline|default:'' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Related Exercise (optional)</label>
        <select name="exercise" class="form-select">
            <option value="">-- Not exercise-specific --</option>
            {% for muscle, exercise_list in all_exercises.items %}
            <optgroup label="{{ muscle }}">
                {% for exercise in exercise_list %}
                <option value="{{ exercise.id }}" {% if goal.exercise_id==exercise.id %}selected{% endif %}>
                    {{ exercise.name }}
                </option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Target Weight (kg) (optional)</label>
        <input type="number" name="target_weight" class="form-control" step="0.5"
            value="{{ goal.target_weight|default:'' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Target Reps (optional)</label>
        <input type="number" name="target_reps" class="form-control" min="1" value="{{ goal.target_reps|default:'' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Description / Notes *</label>
        <textarea name="notes" class="form-control" rows="4" required>{{ goal.notes|default:'' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'goals:goal_detail' goal.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
