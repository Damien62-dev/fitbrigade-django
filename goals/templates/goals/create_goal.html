{% extends "base.html" %}
{% block content %}
<h2>Create New Goal</h2>
<br>
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" required placeholder="e.g., Do my first pull-up">
    </div>

    <div class="mb-3">
        <label class="form-label">Deadline (optional)</label>
        <input type="date" name="deadline" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Related Exercise (optional)</label>
        <select name="exercise" class="form-select">
            <option value="">-- Not exercise-specific --</option>
            {% for muscle, exercise_list in all_exercises.items %}
            <optgroup label="{{ muscle }}">
                {% for exercise in exercise_list %}
                <option value="{{ exercise.id }}">{{ exercise.name }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Target Weight (kg) (optional)</label>
        <input type="number" name="target_weight" class="form-control" step="0.5" placeholder="e.g., 100">
    </div>

    <div class="mb-3">
        <label class="form-label">Target Reps (optional)</label>
        <input type="number" name="target_reps" class="form-control" min="1" placeholder="e.g., 5">
    </div>

    <div class="mb-3">
        <label class="form-label">Description / Notes *</label>
        <textarea name="notes" class="form-control" rows="4" required placeholder="Describe your goal..."></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Goal</button>
    <a href="{% url 'goals:goals_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
