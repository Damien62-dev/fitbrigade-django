{% extends 'base.html' %}
{% load static %}

{% block title %}Create Goal - FitBrigade{% endblock %}

{% block content %}
<a href="{% url 'goals:goals_list' %}" class="back-link">← Back to Goals</a>
<br><br>

<h2>Create New Goal</h2>
<br>

<form method="POST" id="goalForm">
    {% csrf_token %}

    <div class="mb-3">
        <label for="name" class="form-label fw-bold">Name *</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="e.g., Do my first pull-up">
    </div>

    <div class="mb-3">
        <label for="deadline" class="form-label fw-bold">Deadline (optional)</label>
        <input type="date" id="deadline" name="deadline" class="form-control">
    </div>

    <div class="mb-3">
        <label for="exercise" class="form-label fw-bold">Related Exercise (optional)</label>
        <select id="exercise" name="exercise" class="form-select">
            <option value="">-- Not exercise-specific --</option>
            {% for muscle_name, exercises in all_exercises.items %}
            <optgroup label="{{ muscle_name }}">
                {% for exercise in exercises %}
                <option value="{{ exercise.id }}">{{ exercise.name }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="target_weight" class="form-label fw-bold">Target Weight (kg) (optional)</label>
        <input type="number" id="target_weight" name="target_weight" class="form-control" step="0.5"
            placeholder="e.g., 100">
    </div>

    <div class="mb-3">
        <label for="target_reps" class="form-label fw-bold">Target Reps (optional)</label>
        <input type="number" id="target_reps" name="target_reps" class="form-control" min="1" placeholder="e.g., 5">
    </div>

    <div class="mb-3">
        <label for="notes" class="form-label fw-bold">Description / Notes *</label>
        <textarea id="notes" name="notes" class="form-control" rows="4" required
            placeholder="Describe your goal and what success looks like..."></textarea>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a href="{% url 'goals:goals_list' %}" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Save Goal</button>
    </div>
</form>
{% endblock %}
